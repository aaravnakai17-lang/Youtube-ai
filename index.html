<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI YouTube Assistant</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --container-bg: #1f1f1f;
            --text-color: #f1f1f1;
            --accent-color: #ff0000;
            --input-bg: #2d2d2d;
            --bot-msg-bg: #2d2d2d;
            --user-msg-bg: #3e3e3e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 85vh;
            background-color: var(--container-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #333;
        }

        .chat-header {
            padding: 16px;
            background-color: #111;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header .icon {
            width: 32px;
            height: 32px;
            background-color: var(--accent-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
        }

        .chat-header h1 {
            margin: 0;
            font-size: 18px;
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .message.bot {
            background-color: var(--bot-msg-bg);
            align-self: flex-start;
            border-top-left-radius: 4px;
        }

        .message.user {
            background-color: var(--user-msg-bg);
            align-self: flex-end;
            border-top-right-radius: 4px;
        }

        .chat-input-area {
            padding: 16px;
            background-color: #111;
            border-top: 1px solid #333;
            display: flex;
            gap: 8px;
        }

        .chat-input-area input {
            flex: 1;
            background-color: var(--input-bg);
            border: 1px solid #444;
            border-radius: 24px;
            padding: 12px 20px;
            color: var(--text-color);
            font-size: 15px;
            outline: none;
        }

        .chat-input-area input:focus {
            border-color: var(--accent-color);
        }

        .chat-input-area button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.2s;
        }

        .chat-input-area button:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="icon">YT</div>
            <div>
                <h1>YouTube AI Assistant</h1>
            </div>
        </div>
        
        <div class="chat-messages" id="chat-messages">
            <div class="message bot">Hello! I am your AI YouTube Assistant. Ask me for video ideas, scripts, titles, or description help!</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Type a message (e.g., Give me 5 video titles)..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">➔</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const userText = inputField.value.trim();
            if (!userText) return;

            inputField.value = '';
            appendMessage(userText, 'user');
            const thinkingId = appendMessage("Thinking...", 'bot');

            try {
                // Combines your custom YouTube instructions with the user's message
                const systemInstruction = "You are an expert YouTube growth assistant. Help creators brainstorm viral titles, write engaging hooks, and outline video scripts. Keep answers clear and helpful.";
                const fullPrompt = encodeURIComponent(systemInstruction + "\n\nUser request: " + userText);
                
                // Connects to Pollinations' free open AI endpoint (no key or login required)
                const response = await fetch(`https://pollinations.ai{fullPrompt}`);
                
                if (!response.ok) {
                    throw new Error("Server error");
                }

                const aiResponse = await response.text();
                updateMessage(thinkingId, aiResponse);

            } catch (error) {
                console.error(error);
                updateMessage(thinkingId, "Connection error. Please try sending your message again in a moment.");
            }
        }

        function appendMessage(text, sender) {
            const chatMessages = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            const msgId = 'msg-' + Date.now();
            msgDiv.className = `message ${sender}`;
            msgDiv.id = msgId;
            msgDiv.innerText = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return msgId;
        }

        function updateMessage(id, newText) {
            const msgDiv = document.getElementById(id);
            if (msgDiv) {
                msgDiv.innerText = newText;
                const chatMessages = document.getElementById('chat-messages');
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
